#add5ad}.choice-btn .choice-icon{font-size:40px}.choice-btn:active{transform:translateY(4px)}.waiting{font-weight:850;color:#668391;font-size:17px;display:flex;justify-content:center;align-items:center;gap:8px;min-height:74px}.waiting span{font-size:33px;animation:wiggle .6s infinite alternate}.passenger-meter{font-size:15px;font-weight:900;color:#60856a;text-align:center}.footer{text-align:center;padding:2px 10px 6px;font-size:11px;color:#a08670;font-weight:700}

<body>
  <div class="app">
    <header class="topbar">
      <div class="identity"><div class="tiny-avatar" id="headerAvatar">👦</div><div class="identity-text"><strong>🚂 奶思小小交通宇宙</strong><small>奶思 · 六岁生日特别版</small></div></div>
      <div class="top-actions"><button class="icon-btn" id="soundButton" data-action="sound" aria-label="关闭声音" title="声音">🔊</button><button class="icon-btn" data-action="parent" aria-label="家长设置" title="家长设置">⚙️</button></div>
    </header>
    <main class="game-card" id="gameCard">
      <section class="world" id="world" aria-live="polite"></section>
      <section class="control-area" id="controls" aria-live="polite"></section>
    </main>
    <footer class="footer">🎂 奶思六岁生日专列 · 爸爸送给你的交通小世界</footer>
  </div>
  <div class="overlay" id="parentOverlay" hidden role="dialog" aria-modal="true" aria-labelledby="parentTitle">
    <div class="modal"><button class="close" data-action="close-parent" aria-label="关闭">×</button><div id="parentContent"></div></div>
  </div>
  <script>
  (function(){'use strict';
    const $=id=>document.getElementById(id);
    const state={scene:'welcome',boarded:new Set(),candles:new Set(),choice:null,sound:true,advanceTimer:0,sessionMedia:{},urls:{},packaged:{},db:null,dbReady:false};
    const SLOT_INFO={avatar:{label:'首页 / 列车长头像',hint:'推荐清晰的奶思正面照 · JPG/PNG',accept:'image/*',max:12},train:{label:'奶思研究火车的照片',hint:'可选：搭轨道、看地图等专注瞬间',accept:'image/*',max:12},birthday:{label:'生日惊喜照片',hint:'可选：微笑、搞怪或可爱生活照',accept:'image/*',max:12},voice:{label:'爸爸生日祝福语音',hint:'可选：MP3 / M4A，建议 10～25 秒',accept:'audio/*',max:16},video:{label:'爸爸生日祝福视频',hint:'可选：MP4，建议 10～25 秒，尽量小于 60MB',accept:'video/*',max:70}};
    const FILES={avatar:'assets/naisi-avatar.jpg',train:'assets/naisi-train.jpg',birthday:'assets/naisi-birthday.jpg',voice:'assets/papa-voice.mp3',video:'assets/papa-video.mp4'};
    const names=['奶思总站','汽车公园站','六岁生日站'];
    function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function photo(slot,extraClass='',emoji='👦'){let src=state.urls[slot]||(slot!=='avatar'?state.urls.avatar:'')||'';return `<div class="${extraClass}">${src?`<img alt="奶思的照片" src="${escapeHTML(src)}">`:emoji}</div>`;}
    function routeIndex(){return state.scene==='welcome'?0:['ready','closed','ridePark'].includes(state.scene)?0:['park','parkReady','rideFork','fork','rideBirthday'].includes(state.scene)?1:2;}
    function isMoving(){return ['ridePark','rideFork','rideBirthday'].includes(state.scene);}
    function svgArt(){const s=state.scene,park=['park','parkReady'].includes(s),birthday=['birthday','candles','giftReady','gift'].includes(s),fork=s==='fork',tunnel=(s==='rideBirthday'&&state.choice==='tunnel'),bridge=(s==='rideBirthday'&&state.choice==='bridge');return `
      <svg class="bg" viewBox="0 0 1000 580" preserveAspectRatio="xMidYMid slice" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8fdcf1"/><stop offset="1" stop-color="#e0f9f7"/></linearGradient><linearGradient id="trainblue" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#81c8ed"/><stop offset="1" stop-color="#4e9fcf"/></linearGradient><linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a9e7b7"/><stop offset="1" stop-color="#7fcf9e"/></linearGradient></defs>
      <rect width="1000" height="580" fill="url(#sky)"/><circle cx="854" cy="90" r="58" fill="#ffe99a" opacity=".93"/>
      <g class="clouds" fill="#fff" opacity=".92"><ellipse cx="130" cy="100" rx="88" ry="21"/><circle cx="104" cy="83" r="30"/><circle cx="151" cy="78" r="40"/><ellipse cx="645" cy="133" rx="83" ry="21"/><circle cx="619" cy="115" r="33"/><circle cx="665" cy="108" r="37"/></g>

    function note(){switch(state.scene){case 'welcome':return '';case 'ready':return '🚪 准备关门';case 'closed':return '🟢 可以发车啦';case 'ridePark':return '🚂 下一站：汽车公园';case 'park':return state.boarded.size===3?'乘客都上车啦！':'🐾 接小乘客上车';case 'parkReady':return '🚂 前往岔路口';case 'rideFork':return '🛤️ 下一站：岔路口';case 'fork':return '🧭 选一条你喜欢的路';case 'rideBirthday':return state.choice==='tunnel'?'🚇 穿过神奇山洞':'🌉 开过彩虹大桥';case 'birthday':return '🎉 六岁生日站到了！';case 'candles':return '🎂 点亮六根蜡烛';case 'giftReady':return '🎁 生日礼物来啦！';case 'gift':return '❤️ 爸爸的生日礼物';default:return '';}}
    function extra(){const s=state.scene;if(s==='welcome')return `<div class="hero-content">${photo('avatar','hero-avatar float-photo','👦')}<h1>奶思的生日列车</h1><p>奶思 · 6 岁快乐 🎈</p></div>`;if(s==='candles')return `<div class="birthday-decoration"><span class="balloon left">🎈</span><span class="balloon right">🎈</span></div><div class="cake-zone"><div class="candles">${Array.from({length:6},(_,i)=>`<button class="candle ${state.candles.has(i)?'lit':''}" data-action="candle" data-id="${i}" aria-label="点亮第${i+1}根蜡烛"><span class="flame">${state.candles.has(i)?'🔥':'✧'}</span></button>`).join('')}</div><div class="cake-top"></div><div class="cake-bottom">🎂</div><div class="cake-plate"></div></div>`;if(s==='giftReady')return `<div class="birthday-decoration"><span class="balloon left">🎈</span><span class="balloon right">🎈</span><span class="balloon upper">🎊</span></div><div class="hero-content" style="top:25%"><div style="font-size:clamp(95px,19vw,164px);animation:bob 2s infinite">🎁</div><h1>生日惊喜！</h1></div>`;if(s==='gift')return `<div class="birthday-decoration"><span class="balloon left">🎈</span><span class="balloon right">🎈</span></div><div class="surprise">${photo('birthday','gift-photo','🥳')}<h2>奶思，六岁快乐！ 🎂</h2><div class="letter">爸爸给你做了一辆生日小火车。<br>愿你每天都开开心心！ ❤️</div><div class="ticket">🎫 奶思 · 六岁生日专列</div><div id="birthdayVideoHost"></div></div>`;if(s==='park')return `<div class="scene-extra"><div class="emoji-badge">🚗</div><div class="emoji-badge">🚙</div><div class="emoji-badge">🚕</div></div>`;if(['ready','closed','ridePark','parkReady','rideFork','fork','rideBirthday'].includes(s))return `<div class="train-id">${photo('train','id-photo','👦')}<span>奶思列车长</span></div>`;if(s==='birthday')return `<div class="birthday-decoration"><span class="balloon left">🎈</span><span class="balloon right">🎈</span><span class="balloon upper">🎊</span></div>`;return '';}
    function button(action,icon,label,style=''){return `<button class="big-btn ${style}" data-action="${action}"><span class="btn-icon">${icon}</span>${label}</button>`;}
    function controls(){const s=state.scene;switch(s){case 'welcome':return `<div class="prompt">欢迎奶思列车长！</div><div class="controls">${button('start','🚂','出发啦！')}</div>`;case 'ready':return `<div class="prompt">小火车准备好啦！</div><div class="controls">${button('close-door','🚪','关门')}</div>`;case 'closed':return `<div class="prompt">车门关好，准备发车！</div><div class="controls">${button('launch','🚦','发车！')}${button('horn','📣','鸣笛','blue')}</div>`;case 'ridePark':case 'rideFork':case 'rideBirthday':return `<div class="prompt">${s==='ridePark'?'开往汽车公园':s==='rideFork'?'正在前往岔路口':'下一站：六岁生日站！'}</div><div class="waiting"><span>🚂</span>小火车正在前进…</div>`;case 'park':return state.boarded.size!==3?`<div class="prompt">点一点，接他们上车！</div><div class="controls">${['🐰','🐻','🐼'].map((animal,i)=>`<button class="passenger-btn ${state.boarded.has(i)?'onboard':''}" data-action="board" data-id="${i}" aria-label="让小乘客${i+1}上车">${animal}</button>`).join('')}</div><div class="passenger-meter">已上车 ${state.boarded.size} / 3 🐾</div>`:`<div class="prompt">三个小乘客都上车啦！</div><div class="controls">${button('park-close','🚪','关门')}</div>`;case 'parkReady':return `<div class="prompt">下一站，神奇岔路口！</div><div class="controls">${button('park-launch','🚂','发车！')}</div>`;case 'fork':return `<div class="prompt">奶思想走哪一条路？</div><div class="controls"><button class="choice-btn" data-action="choose-tunnel"><span class="choice-icon">🚇</span>山洞路线</button><button class="choice-btn" data-action="choose-bridge"><span class="choice-icon">🌉</span>大桥路线</button></div>`;case 'birthday':return `<div class="prompt">到站啦！打开生日车站的门</div><div class="controls">${button('birthday-door','🚪','开门！')}</div>`;case 'candles':return `<div class="prompt">点亮生日蛋糕上的蜡烛！</div><div class="subprompt">${state.candles.size} / 6 根已点亮 ✨</div>`;case 'giftReady':return `<div class="prompt">有一份爸爸的神秘礼物！</div><div class="controls">${button('open-gift','🎁','拆礼物！')}</div>`;case 'gift':return `<div class="prompt">奶思，生日快乐！ ❤️</div><div class="controls">${button('dad-message','▶️','听爸爸祝福','secondary')}${button('replay','🚂','再开一趟')}</div>`;default:return '';}}
    function render(){const w=$('world');w.className='world'+(isMoving()?' is-moving':'');w.innerHTML=svgArt()+`<div class="stage-top"><span class="station-tag">${note()||'🎂 奶思的六岁生日专列'}</span>${dots()}</div>`+extra();$('controls').innerHTML=controls();$('headerAvatar').innerHTML=state.urls.avatar?`<img alt="奶思" src="${escapeHTML(state.urls.avatar)}">`:'👦';$('soundButton').textContent=state.sound?'🔊':'🔇';$('soundButton').setAttribute('aria-label',state.sound?'关闭声音':'打开声音');if(state.scene==='gift')attachVideo();}
    let ac=null;
    function bell(n=1){if(!state.sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();for(let i=0;i<n;i++){let o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.14;o.type='sine';o.frequency.setValueAtTime(500+i*110,t);o.frequency.exponentialRampToValueAtTime(740+i*70,t+.13);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.085,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.19)}}catch(e){} }
    function speak(str){if(!state.sound||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(str);u.lang='zh-CN';u.rate=.87;u.pitch=1.14;u.volume=.92;const v=speechSynthesis.getVoices().find(v=>/zh(-|_)CN/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){} }
    function stopAudio(){try{speechSynthesis.cancel()}catch(e){}const x=$('dadAudio');if(x){x.pause();x.currentTime=0}const v=$('birthdayVideo');if(v){v.pause()}}
    function switchScene(next,spoken){clearTimeout(state.advanceTimer);state.scene=next;render();if(spoken)speak(spoken);}
    function travel(next,duration,line,spoken){switchScene(line,spoken);state.advanceTimer=setTimeout(()=>{if(state.scene===line){switchScene(next);if(next==='park')speak('汽车公园站，到了！');if(next==='fork')speak('前方岔路口，请选择路线。');if(next==='birthday'){bell(3);speak('六岁生日站，到了！')}}},duration);}
    function handle(action,id){if(!action)return;if(!['sound','parent','close-parent'].includes(action))bell();switch(action){case 'sound':state.sound=!state.sound;if(!state.sound)stopAudio();render();break;case 'parent':openParent();break;case 'close-parent':closeParent();break;case 'start':if(state.scene==='welcome')switchScene('ready','欢迎奶思列车长，生日专列准备发车！');break;case 'close-door':if(state.scene==='ready')switchScene('closed','车门即将关闭。');break;case 'horn':if(state.scene==='closed'){bell(3);speak('呜——，奶思生日专列即将出发！')}break;case 'launch':if(state.scene==='closed')travel('park',3400,'ridePark','列车出发！下一站，汽车公园站。');break;case 'board':if(state.scene==='park'&&!state.boarded.has(Number(id))){state.boarded.add(Number(id));render();if(state.boarded.size===3){bell(2);speak('小乘客都上车啦！')}}break;case 'park-close':if(state.scene==='park'&&state.boarded.size===3)switchScene('parkReady','车门即将关闭。');break;case 'park-launch':if(state.scene==='parkReady')travel('fork',2900,'rideFork','列车出发！前方有两条路线。');break;case 'choose-tunnel':case 'choose-bridge':if(state.scene==='fork'){state.choice=action==='choose-tunnel'?'tunnel':'bridge';travel('birthday',3700,'rideBirthday',state.choice==='tunnel'?'我们出发，穿过神奇山洞！':'我们出发，开过彩虹大桥！')}break;case 'birthday-door':if(state.scene==='birthday')switchScene('candles','奶思，点亮六根生日蜡烛吧！');break;case 'candle':if(state.scene==='candles'&&!state.candles.has(Number(id))){state.candles.add(Number(id));render();if(state.candles.size===6){bell(3);state.advanceTimer=setTimeout(()=>{if(state.scene==='candles')switchScene('giftReady','六岁生日快乐！还有一份惊喜！')},900)}}break;case 'open-gift':if(state.scene==='gift'){break;}if(state.scene==='giftReady'){switchScene('gift');bell(3);playDad()}break;case 'dad-message':if(state.scene==='gift')playDad();break;case 'replay':stopAudio();state.boarded=new Set();state.candles=new Set();state.choice=null;switchScene('welcome');break;}}
    function mediaURL(slot){return state.urls[slot]||null;}
    async function playDad(){if(!state.sound)return;const video=$('birthdayVideo');if(video&&mediaURL('video')){try{video.currentTime=0;await video.play();return}catch(e){}}const voice=mediaURL('voice');if(voice){let audio=$('dadAudio');if(!audio){audio=document.createElement('audio');audio.id='dadAudio';audio.style.display='none';document.body.appendChild(audio)}audio.src=voice;try{audio.currentTime=0;await audio.play();return}catch(e){}}speak('奶思，生日快乐！今天你六岁啦！爸爸专门给你做了一辆生日小火车。希望你每天都开开心心的，去发现好多好多有意思的东西。爸爸爱你，等我们见面，一起去坐大火车！');}
    function attachVideo(){const host=$('birthdayVideoHost');if(!host)return;const src=mediaURL('video');if(src){host.innerHTML=`<video id="birthdayVideo" controls playsinline preload="metadata" style="display:block;max-width:100%;max-height:22vh;border-radius:12px;background:#1e2a44" src="${escapeHTML(src)}"></video>`}else host.innerHTML='';}
    $('gameCard').addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(b)handle(b.dataset.action,b.dataset.id)});
    document.querySelector('.topbar').addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(b)handle(b.dataset.action,b.dataset.id)});
    $('parentOverlay').addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(b)handle(b.dataset.action,b.dataset.id);if(e.target===$('parentOverlay'))closeParent()});
    function openParent(){stopAudio();$('parentOverlay').hidden=false;document.body.style.overflow='hidden';renderParentGate();}
    function closeParent(){$('parentOverlay').hidden=true;document.body.style.overflow='';}
    function renderParentGate(){$('parentContent').innerHTML=`<h2 id="parentTitle">👨‍👦 家长设置</h2><p>这部分只给爸爸妈妈设置照片和祝福素材。</p><p><strong>请家长回答：9 + 4 = ?</strong></p><div class="gate-row"><input type="number" id="parentAnswer" min="0" max="30" inputmode="numeric" aria-label="家长验证答案"><button class="parent-btn" data-action="parent-check">进入</button></div><p class="status" id="parentStatus"></p>`;$('parentAnswer').focus();}
    $('parentOverlay').addEventListener('keydown',e=>{if(e.key==='Escape')closeParent();if(e.key==='Enter'&&$('parentAnswer'))checkParent()});
    $('parentOverlay').addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;if(b.dataset.action==='parent-check')checkParent();if(b.dataset.action==='parent-clear'){if(confirm('只删除这台设备上保存的照片和视频？'))clearMedia();}});
    function checkParent(){if(($('parentAnswer')||{}).value==='13')renderParentSettings();else $('parentStatus').textContent='请家长输入正确答案哦。';}
    function renderParentSettings(){const rows=Object.entries(SLOT_INFO).map(([key,info])=>`<div class="asset-row"><div><strong>${info.label}</strong><small>${info.hint}</small><small id="assetStatus-${key}">${state.sessionMedia[key]?'✅ 已设置':state.urls[key]?'✅ 已有素材':'暂未设置，显示默认插画 / 祝福'}</small></div><div class="filepicker"><label for="asset-${key}">选择文件</label><input type="file" id="asset-${key}" data-asset="${key}" accept="${info.accept}"></div></div>`).join('');$('parentContent').innerHTML=`<h2 id="parentTitle">🎁 爸爸布置生日惊喜</h2><p>选择照片、语音或视频后，游戏会在<strong>这台设备</strong>保存素材。只上传一张头像也可以，其他照片位置会优先沿用头像。</p>${rows}<div class="parent-note">🔒 素材只保存于当前浏览器，不会上传服务器。<strong>如果爸爸和奶思用不同设备：</strong>本机选择的文件不会自动出现在孩子设备上。要跨设备分享，请把对应文件放进游戏包的 assets 文件夹后再发布网页（见使用说明），或在孩子的设备上进入这里选择素材。</div><p class="status" id="parentStatus"></p><div style="display:flex;flex-wrap:wrap;gap:9px;margin-top:15px"><button class="parent-btn" data-action="close-parent">完成，返回游戏</button><button class="parent-btn danger" data-action="parent-clear">删除本机素材</button></div>`;}
    $('parentOverlay').addEventListener('change',async e=>{let inp=e.target.closest('[data-asset]');if(!inp||!inp.files||!inp.files[0])return;const key=inp.dataset.asset,file=inp.files[0],spec=SLOT_INFO[key];if(file.size>spec.max*1024*1024){$('parentStatus').textContent=`文件太大啦，${spec.label}最多 ${spec.max}MB。`;inp.value='';return;}if(!file.type.startsWith(spec.accept==='image/*'?'image/':spec.accept==='audio/*'?'audio/':'video/')){$('parentStatus').textContent='文件格式不正确，请换一个文件。';return;}$('parentStatus').textContent='正在保存素材…';let blob=file;if(key==='avatar'||key==='train'||key==='birthday'){try{blob=await compressImage(file)}catch(e){blob=file}}let saved=false;try{saved=await storeAsset(key,blob,file.name)}catch(e){}if(state.urls[key]&&state.urls[key].startsWith('blob:'))URL.revokeObjectURL(state.urls[key]);state.urls[key]=URL.createObjectURL(blob);state.sessionMedia[key]={blob,name:file.name};$('parentStatus').textContent=saved?'✅ 已保存！这台设备重新打开游戏仍可使用。':'✅ 本次已使用；浏览器限制了持久存储，关闭后可能需重新选择。';renderParentSettings();render();});
    function compressImage(file){return new Promise((resolve,reject)=>{let img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const scale=Math.min(1,1200/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));let ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);canvas.toBlob(blob=>blob?resolve(blob):reject(Error('压缩失败')),'image/jpeg',.85)};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('图片无法读取'))};img.src=url})}
    function openDB(){return new Promise((resolve,reject)=>{if(!window.indexedDB){reject(Error('IndexedDB unavailable'));return;}let req=indexedDB.open('naisi-traffic-v1',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('media'))req.result.createObjectStore('media',{keyPath:'slot'})};req.onsuccess=()=>{state.db=req.result;state.dbReady=true;resolve(req.result)};req.onerror=()=>reject(req.error)})}
    function storeAsset(slot,blob,name){return new Promise(resolve=>{if(!state.db){resolve(false);return;}try{let t=state.db.transaction('media','readwrite');t.objectStore('media').put({slot,blob,name});t.oncomplete=()=>resolve(true);t.onerror=()=>resolve(false)}catch(e){resolve(false)}})}
    function loadSaved(){return new Promise(resolve=>{if(!state.db){resolve();return;}try{let tx=state.db.transaction('media','readonly'),req=tx.objectStore('media').getAll();req.onsuccess=()=>{for(let a of req.result){state.urls[a.slot]=URL.createObjectURL(a.blob);state.sessionMedia[a.slot]=a;}resolve()};req.onerror=()=>resolve()}catch(e){resolve()}})}
    async function clearMedia(){if(state.db){try{state.db.transaction('media','readwrite').objectStore('media').clear()}catch(e){}}for(let key of Object.keys(SLOT_INFO)){if(state.urls[key]?.startsWith('blob:'))URL.revokeObjectURL(state.urls[key]);delete state.urls[key];delete state.sessionMedia[key]}renderParentSettings();render();$('parentStatus').textContent='本机素材已清除。';}
    function detectPackagedImage(slot){return new Promise(resolve=>{let im=new Image();im.onload=()=>{if(!state.urls[slot])state.urls[slot]=FILES[slot];resolve()};im.onerror=()=>resolve();im.src=FILES[slot]});}
    function detectPackagedMedia(slot,tag){return new Promise(resolve=>{let el=document.createElement(tag),done=false;const finish=(ok)=>{if(done)return;done=true;if(ok&&!state.urls[slot])state.urls[slot]=FILES[slot];el.removeAttribute('src');el.load?.();resolve()};el.preload='metadata';el.onloadedmetadata=()=>finish(true);el.onerror=()=>finish(false);el.src=FILES[slot];setTimeout(()=>finish(false),1500)});}
    function init(){render();openDB().then(loadSaved).catch(()=>{}).finally(()=>{Promise.all([detectPackagedImage('avatar'),detectPackagedImage('train'),detectPackagedImage('birthday'),detectPackagedMedia('voice','audio'),detectPackagedMedia('video','video')]).then(render);render()})}
    init();
    // For test automation and accessibility smoke checks; not exposed in the child's UI.
    window.__naisiGame={getScene:()=>state.scene,getBoarded:()=>state.boarded.size,getCandles:()=>state.candles.size};
  })();
  </script>
