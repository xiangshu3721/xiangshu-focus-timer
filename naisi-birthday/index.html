us-timer/naisi-birthday/?v=3">🎮 打开在线游戏</a></div></section></section>

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),nodeList=[
{id:'hub',name:'奶思总站',icon:'🏠',x:140,y:315},
{id:'car',name:'汽车公园',icon:'🚗',x:315,y:165},
{id:'bridge',name:'彩虹大桥',icon:'🌈',x:540,y:145},
{id:'zoo',name:'动物园',icon:'🐼',x:770,y:220},
{id:'rail',name:'高铁站',icon:'🚄',x:325,y:420},
{id:'tunnel',name:'山洞站',icon:'🚇',x:575,y:415},
{id:'birthday',name:'生日站',icon:'🎂',x:790,y:435}];
const nodes=Object.fromEntries(nodeList.map(n=>[n.id,n]));const edges=[['hub','car'],['hub','rail'],['car','bridge'],['car','rail'],['bridge','zoo'],['bridge','tunnel'],['rail','tunnel'],['tunnel','birthday'],['zoo','birthday'],['tunnel','zoo']];
const tasks={car:{name:'接上小乘客',icon:'🐰',objects:['🐰','🐻','🐱'],verb:'点点小乘客，上车啦！'},rail:{name:'装好小火车',icon:'🚄',objects:['🚃','🚋','🚃'],verb:'点点三节车厢，出发！'},zoo:{name:'找到动物朋友',icon:'🐼',objects:['🐼','🦊','🐵'],verb:'点点动物，拍张照！'}};
const s={phase:'home',here:'hub',vehicle:'train',target:null,route:[],routes:[],step:0,completed:new Set(),tapped:new Set(),candles:new Set(),moving:false,sound:true,trafficDone:false,roadDone:false,blocked:null,queued:null,media:{},db:null};let soundCtx=null,toastTimer=null;
const get=id=>nodes[id];const edgeKey=(a,b)=>[a,b].sort().join(':');const neighbors=id=>edges.filter(e=>e.includes(id)&&edgeKey(...e)!==s.blocked).map(e=>e[0]===id?e[1]:e[0]);
function paths(from,to,block=s.blocked){const found=[];function walk(cur,visited){if(cur===to){found.push([...visited]);return}if(visited.length>=7)return;for(const [a,b] of edges){if(edgeKey(a,b)===block)continue;const next=a===cur?b:b===cur?a:null;if(next&&!visited.includes(next))walk(next,[...visited,next])}}walk(from,[from]);return found.sort((a,b)=>a.length-b.length).slice(0,14)}
function twoRoutes(from,to){const p=paths(from,to);if(!p.length)return [];const alt=p.find(x=>x.slice(1,-1).some(v=>!p[0].includes(v)))||p[1];return alt?[p[0],alt]:[p[0]]}
function coordPath(route){return (route||[]).map((id,i)=>`${i?'L':'M'} ${nodes[id].x} ${nodes[id].y}`).join(' ')}
function sparkle(){if(!s.sound)return;try{soundCtx=soundCtx||new(window.AudioContext||window.webkitAudioContext)();if(soundCtx.state==='suspended')soundCtx.resume();const now=soundCtx.currentTime;[660,880].forEach((freq,i)=>{const osc=soundCtx.createOscillator(),gain=soundCtx.createGain();osc.type='sine';osc.frequency.value=freq;gain.gain.setValueAtTime(.0001,now+i*.09);gain.gain.exponentialRampToValueAtTime(.07,now+i*.09+.01);gain.gain.exponentialRampToValueAtTime(.0001,now+i*.09+.17);osc.connect(gain).connect(soundCtx.destination);osc.start(now+i*.09);osc.stop(now+i*.09+.18)})}catch{}}
let preferredVoice=null;
function pickVoice(){try{if(!('speechSynthesis' in window))return;const voices=speechSynthesis.getVoices();preferredVoice=voices.find(v=>/^zh/i.test(v.lang||'')&&/(Xiaoxiao|Xiaoyi|Yunjian|Yunxi|Tingting|Sin-ji|Mei-Jia|Huihui|Kangkang|Yaoyao|HanHan|Xiaochen|Chenxi)/i.test(v.name||''))||voices.find(v=>/^zh/i.test(v.lang||''))||voices.find(v=>/Chinese|Mandarin/i.test((v.lang||'')+' '+(v.name||'')))||null}catch{preferredVoice=null}}
if('speechSynthesis' in window){try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch{}}
function speak(t){$('navBubble').textContent=t;if(!s.sound)return;try{if('speechSynthesis' in window){pickVoice();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=preferredVoice?.lang||'zh-CN';if(preferredVoice)u.voice=preferredVoice;u.rate=.9;u.pitch=1;u.volume=.96;speechSynthesis.speak(u)}}catch{}}
function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,2000)}
function renderMap(){const roads=$('roads');roads.innerHTML=edges.map(([a,b])=>`<line class="road" x1="${get(a).x}" y1="${get(a).y}" x2="${get(b).x}" y2="${get(b).y}"/><line class="road-core" x1="${get(a).x}" y1="${get(a).y}" x2="${get(b).x}" y2="${get(b).y}"/>`).join('');const preview=s.phase==='route'||s.phase==='roadwork';let routeMarkup='';if(preview){s.routes.forEach((r,i)=>{routeMarkup+=`<path d="${coordPath(r)}" class="${i?'route-preview-green':'route-preview-blue'}"/>`})}else if(s.route.length>1){routeMarkup=`<path d="${coordPath(s.route)}" class="route-main"/>`;}if(s.blocked){const [a,b]=s.blocked.split(':');routeMarkup+=`<line class="blocked" x1="${get(a).x}" y1="${get(a).y}" x2="${get(b).x}" y2="${get(b).y}"/>`}$('routeLines').innerHTML=routeMarkup;
const allowed=s.phase==='navigate'&&!s.moving?neighbors(s.here):[];$('pins').innerHTML=nodeList.map(n=>{let cls=n.id===s.here?'is-here':n.id===s.target?'is-dest':allowed.includes(n.id)?'is-next':'';if(allowed.includes(n.id))cls+=' is-next';let disabled=!allowed.includes(n.id);return `<button class="map-pin ${cls}" data-node="${n.id}" style="--x:${n.x/9}%;--y:${n.y/5.4}%" ${disabled?'disabled':''} aria-label="${n.name}${n.id===s.here?'，你在这里':allowed.includes(n.id)?'，点击前往':''}"><span class="face">${n.icon}</span><span class="name">${n.name}</span></button>`}).join('');$('mapTitle').textContent=s.target?`🗺️ ${get(s.here).name} → ${get(s.target).name}`:'🗺️ 奶思的城市地图';$('vehicleChip').textContent=s.vehicle==='train'?'🚆 小火车':'🚗 小汽车';$('starChip').textContent=`⭐ ${Math.min(2,s.completed.size)}/2`;$('vehicleMarker').textContent=s.vehicle==='train'?'🚆':'🚗';if(!s.moving){$('vehicleMarker').style.setProperty('--vx',get(s.here).x/9+'%');$('vehicleMarker').style.setProperty('--vy',get(s.here).y/5.4+'%');$('vehicleMarker').classList.remove('move')}
$('mapHint').textContent=s.phase==='navigate'?'👆 点击发光的车站也能出发':'🧭 蓝色路线 / 绿色路线';}
function btn(label,act,cls='choice',icon='',extra=''){return `<button class="${cls}" data-act="${act}" ${extra}><span class="big">${icon}</span><span>${label}</span></button>`}
function renderPanel(){const p=$('panel');let html='';const progress=`<div class="progress"><span class="star ${s.completed.size>=1?'yes':''}">⭐</span><span class="star ${s.completed.size>=2?'yes':''}">⭐</span><span class="star ${s.phase==='gift'?'yes':''}">🎂</span></div>`;
switch(s.phase){case 'home':html=`<div class="eyebrow">🎉 奶思的六岁生日专列</div><div class="photo" id="heroPhoto">${s.media.avatar?`<img src="${s.media.avatar}" alt="奶思照片">`:'👨‍✈️'}</div><h1>奶思，出发啦！</h1><p>今天你来当司机！</p><div class="buttons">${btn('开小火车','start-train','choice sun','🚆')}${btn('开小汽车','start-car','choice mint','🚗')}</div><div class="mini-hint">👆 点一辆喜欢的车</div>`;break;
case 'select':{const options=Object.entries(tasks).filter(([k])=>!s.completed.has(k));const last=s.completed.size>=2;html=`<div class="eyebrow">${last?'🎁 生日惊喜解锁啦！':'🗺️ 今天想去哪里？'}</div><h1>${last?'去寻找生日惊喜！':'选择目的地'}</h1><p>${last?'地图上有一座神秘的生日车站':'送完两个任务，就能找到生日车站'}</p>${progress}<div class="buttons ${last?'one':options.length===3?'three':''}">${last?btn('六岁生日站','target-birthday','choice pink','🎂'):options.map(([id,t])=>btn(get(id).name,'target-'+id,'choice '+(id==='car'?'sun':id==='rail'?'mint':'pink'),get(id).icon)).join('')}</div><div class="mini-hint">👆 选一站，地图就会帮你找路</div>`;break;}
case 'route':case 'roadwork':html=`<div class="eyebrow">${s.phase==='roadwork'?'🚧 前方修路，重新规划！':'🧭 导航准备好了'}</div><h1>${s.phase==='roadwork'?'换条路线走！':'你想走哪条路？'}</h1><p>${get(s.here).icon} ${get(s.here).name} → ${get(s.target).icon} ${get(s.target).name}</p><div class="buttons ${s.routes.length===1?'one':''}">${s.routes.map((r,i)=>btn(i?'绿色风景线':'蓝色快快线','route-'+i,'choice '+(i?'mint':'blue')+(i===0?' recommend':''),i?'🌳':'🧭',`aria-label="${i?'绿色风景线':'蓝色快快线'}，经过 ${r.map(id=>get(id).name).join('、')}"`)).join('')}</div><div class="mini-hint">${s.routes.map((r,i)=>`${i?'🟢':'🔵'} ${r.length-1} 站`).join('　')}</div>`;break;
case 'navigate':{const opts=neighbors(s.here).sort((a,b)=>Number(b===s.route[1])-Number(a===s.route[1]));html=`<div class="eyebrow">📍 现在：${get(s.here).name}</div><h1>${get(s.target).icon} 去${get(s.target).name}！</h1><p>看地图，选下一站！</p><div class="buttons ${opts.length>=3?'three':opts.length===1?'one':''}">${opts.map(id=>btn(get(id).name,'go-'+id,'choice '+(id===s.route[1]?'recommend sun':'mint'),get(id).icon,`${s.moving?'disabled':''}`)).join('')}</div><div class="mini-hint">⭐ 亮起来的路线是导航推荐，也可以探索别的路！</div>`;break;}
case 'traffic':html=`<div class="eyebrow">🚦 路上有小挑战！</div><div class="event-icon">🔴</div><h1>红灯亮啦！</h1><p>点一下红灯，让它变绿再出发</p><div class="buttons one">${btn('点亮绿灯','green','choice mint','🚦')}</div>`;break;
case 'task':{const t=tasks[s.target];html=`<div class="eyebrow">📍 ${get(s.target).name}</div><h1>${t.verb}</h1><div class="task-objects">${t.objects.map((o,i)=>`<button class="tap-object ${s.tapped.has(i)?'done':''}" data-act="tap-${i}" ${s.tapped.has(i)?'disabled':''} aria-label="${t.name} ${i+1}">${o}</button>`).join('')}</div><div class="mini-hint">${s.tapped.size}/3　👆 点击三个小图标</div>`;break;}
case 'success':html=`<div class="eyebrow">🎉 完成任务啦！</div><div class="event-icon">⭐</div><h1>奶思真厉害！</h1>${progress}<div class="buttons one">${btn('再去一站！','next-mission','choice sun','🗺️')}</div>`;break;
case 'candles':html=`<div class="eyebrow">🎂 生日车站到了！</div><h1>奶思，六岁快乐！</h1><div class="confetti">🎊 🎈 🎊</div><p>点亮六根生日蜡烛</p><div class="candles">${Array.from({length:6},(_,i)=>`<button class="candle ${s.candles.has(i)?'lit':''}" data-act="candle-${i}" ${s.candles.has(i)?'disabled':''} aria-label="点亮第${i+1}根蜡烛">${s.candles.has(i)?'🔥':'🕯️'}</button>`).join('')}</div><div class="mini-hint">${s.candles.size}/6　✨</div>${s.candles.size===6?`<button class="primary" data-act="open-gift">🎁 打开爸爸的礼物！</button>`:''}`;break;
case 'gift':html=`<div class="gift-wrap"><div class="confetti">🎉 🎂 🎉</div><h2>奶思，生日快乐！</h2><div class="photo">${s.media.birthday||s.media.avatar?`<img src="${s.media.birthday||s.media.avatar}" alt="生日照片">`:'🎁'}</div><p>爸爸给你的专属生日惊喜 ❤️</p><p>奶思，六岁生日快乐！爸爸爱你！</p><div id="giftVideo"></div><div class="buttons">${btn('爸爸的祝福','dad','choice pink','❤️')}${btn('再开一趟','restart','choice mint','🚆')}</div></div>`;break;}
p.innerHTML=html;if(s.phase==='gift'&&s.media.video){const v=document.createElement('video');v.src=s.media.video;v.controls=true;v.playsInline=true;v.preload='metadata';v.className='video';v.setAttribute('aria-label','爸爸的生日祝福视频');$('giftVideo')?.appendChild(v)} }
function render(){renderMap();renderPanel();$('avatar').innerHTML=s.media.avatar?`<img src="${s.media.avatar}" alt="奶思头像">`:'🚆';$('soundBtn').textContent=s.sound?'🔊':'🔇';}
function chooseMission(id){if(!nodes[id]||(id!=='birthday'&&s.completed.has(id)))return;s.target=id;s.route=[];s.blocked=null;s.routes=twoRoutes(s.here,id);s.phase='route';speak('目的地，'+get(id).name+'。选一条路线吧！');render();}
function chooseRoute(i){if(!s.routes[i])return;s.route=[...s.routes[i]];s.phase='navigate';speak('导航开始！下一站，'+get(s.route[1]).name+'。');render()}
function prepareMove(next){if(s.moving||!neighbors(s.here).includes(next))return;if(!s.trafficDone&&s.completed.size>=1){s.trafficDone=true;s.queued=next;s.phase='traffic';speak('前方红灯，请停车！');render();return}if(s.target==='birthday'&&!s.roadDone){s.roadDone=true;s.blocked=edgeKey(s.here,next);s.routes=twoRoutes(s.here,s.target);s.phase='roadwork';speak('前方道路施工，重新规划路线！');render();return}move(next)}
function move(next){if(s.moving||!neighbors(s.here).includes(next))return;const old=s.here,wasRecommended=s.route[1]===next;s.moving=true;s.phase='navigate';const label=wasRecommended?'下一站，'+get(next).name+'。':'发现新路线，正在重新规划！';speak(label);render();const marker=$('vehicleMarker');marker.classList.add('move');requestAnimationFrame(()=>requestAnimationFrame(()=>{marker.style.setProperty('--vx',get(next).x/9+'%');marker.style.setProperty('--vy',get(next).y/5.4+'%')}));setTimeout(()=>{s.moving=false;s.here=next;s.route=paths(next,s.target)[0]||[next];if(next===s.target){if(next==='birthday'){s.phase='candles';s.blocked=null;s.candles.clear();speak('六岁生日站，到了！奶思，点亮蜡烛吧！')}else{s.phase='task';s.tapped.clear();speak(get(next).name+'，到了！'+tasks[next].verb)}}else{speak('已到达，'+get(next).name+'。'+(wasRecommended?'下一站，'+get(s.route[1]).name+'。':'新路线规划好了！'))}render()},1160)}
function finishTask(){s.completed.add(s.target);s.phase='success';s.route=[];sparkle();speak('任务完成，奶思真厉害！');render()}
function dadBlessing(){sparkle();const video=$('giftVideo video');if(video){video.currentTime=0;video.play().catch(()=>{});return}if(s.media.voice){let a=$('dadAudio');if(!a){a=document.createElement('audio');a.id='dadAudio';document.body.appendChild(a)}a.src=s.media.voice;a.currentTime=0;a.play().catch(()=>speak('奶思，六岁生日快乐！爸爸爱你！'));return}speak('奶思，六岁生日快乐！爸爸爱你！')}
function reset(){s.phase='home';s.here='hub';s.target=null;s.route=[];s.routes=[];s.completed.clear();s.tapped.clear();s.candles.clear();s.moving=false;s.trafficDone=false;s.roadDone=false;s.blocked=null;s.queued=null;speak('奶思，出发啦！');render()}
$('panel').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;sparkle();if(a==='start-train'||a==='start-car'){s.vehicle=a==='start-train'?'train':'car';s.phase='select';speak('奶思列车长，你想去哪里？');render()}else if(a.startsWith('target-'))chooseMission(a.slice(7));else if(a.startsWith('route-'))chooseRoute(Number(a.slice(6)));else if(a.startsWith('go-'))prepareMove(a.slice(3));else if(a==='green'){s.phase='navigate';const next=s.queued;s.queued=null;speak('绿灯亮啦，可以出发！');render();if(next)setTimeout(()=>move(next),180)}else if(a.startsWith('tap-')){s.tapped.add(Number(a.slice(4)));if(s.tapped.size===3)finishTask();else{sparkle();render()}}else if(a==='next-mission'){s.phase='select';s.target=null;s.blocked=null;s.route=[];speak(s.completed.size>=2?'生日车站解锁啦！':'再选一个地方吧！');render()}else if(a.startsWith('candle-')){s.candles.add(Number(a.slice(7)));if(s.candles.size===6){sparkle();speak('奶思，六岁生日快乐！');}render()}else if(a==='open-gift'){s.phase='gift';speak('奶思，爸爸有一份生日祝福送给你！');render();dadBlessing()}else if(a==='dad')dadBlessing();else if(a==='restart')reset()});
$('pins').addEventListener('click',e=>{const b=e.target.closest('[data-node]');if(b&&!b.disabled&&s.phase==='navigate')prepareMove(b.dataset.node)});
$('soundBtn').addEventListener('click',()=>{s.sound=!s.sound;if(!s.sound)try{speechSynthesis.cancel()}catch{};render();if(s.sound)speak('声音已打开！')});
const overlay=$('parentOverlay');$('parentBtn').addEventListener('click',()=>{overlay.hidden=false;showGate()});$('closeParent').addEventListener('click',()=>overlay.hidden=true);overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.hidden=true});
function showGate(){$('parentContent').innerHTML='<p>只有家长可以设置奶思的照片和爸爸祝福。</p><label for="gate">9 + 4 = ?</label><input type="number" inputmode="numeric" id="gate" aria-label="家长验证答案"><div class="row"><button class="primary" id="gateBtn">进入设置</button></div><p id="gateMsg"></p>';$('gateBtn').onclick=()=>{if($('gate').value==='13')showSettings();else $('gateMsg').textContent='再算一算哦！'}}
const slots=[['avatar','奶思头像','image/*',8],['birthday','生日照片','image/*',8],['voice','爸爸的祝福录音','audio/*',15],['video','爸爸的祝福视频','video/*',35]];
function showSettings(){$('parentContent').innerHTML='<p>素材只保存在当前设备，不上传到网站。爸爸和奶思使用不同设备时，需在奶思的设备上添加。</p>'+slots.map(([k,label,accept,limit])=>`<label for="file-${k}">${label} ${s.media[k]?'✅':''}</label><input type="file" id="file-${k}" accept="${accept}" data-slot="${k}"><small>建议不超过 ${limit} MB</small>`).join('')+'<p class="note">⚠️ 公开网址不适合直接打包孩子照片和视频。请只在家人的设备本地设置；不同设备不会自动同步。</p><p id="settingsMsg" aria-live="polite"></p><div class="row"><button class="secondary" id="clearMedia">清除本机照片与视频</button></div>';$('parentContent').querySelectorAll('input[data-slot]').forEach(el=>el.addEventListener('change',async()=>{const file=el.files?.[0];if(!file)return;const spec=slots.find(x=>x[0]===el.dataset.slot);if(file.size>spec[3]*1024*1024){$('settingsMsg').textContent='文件太大，请换一个小一点的素材';return}const old=s.media[el.dataset.slot];if(old?.startsWith('blob:'))URL.revokeObjectURL(old);s.media[el.dataset.slot]=URL.createObjectURL(file);try{if(s.db){const tx=s.db.transaction('media','readwrite');tx.objectStore('media').put({id:el.dataset.slot,blob:file});await new Promise((ok,bad)=>{tx.oncomplete=ok;tx.onerror=bad});$('settingsMsg').textContent='✅ 已保存到这台设备！'}else $('settingsMsg').textContent='✅ 本次已使用；这个浏览器无法持久保存素材'}catch{$('settingsMsg').textContent='✅ 本次已使用；关闭浏览器后可能需要重新选择'}showSettings();render()}));$('clearMedia').onclick=()=>{if(!confirm('确定删除这台设备上设置的素材？'))return;for(const v of Object.values(s.media))if(v.startsWith('blob:'))URL.revokeObjectURL(v);s.media={};if(s.db)try{s.db.transaction('media','readwrite').objectStore('media').clear()}catch{}showSettings();render()}}
function initDB(){if(!window.indexedDB)return;let req;try{req=indexedDB.open('naisi-traffic-media-v2',1)}catch{return}req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('media'))req.result.createObjectStore('media',{keyPath:'id'})};req.onsuccess=()=>{s.db=req.result;const r=s.db.transaction('media','readonly').objectStore('media').getAll();r.onsuccess=()=>{for(const item of r.result){s.media[item.id]=URL.createObjectURL(item.blob)}render()}}}
initDB();speak('奶思，欢迎来到你的城市交通宇宙！');render();window.__naisiV2={state:s,paths,neighbors,getPhase:()=>s.phase,chooseMission,chooseRoute,move,render};
})();
</script>
</body></html>
