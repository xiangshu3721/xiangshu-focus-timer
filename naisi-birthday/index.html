function handleStationAction(a){if(a==='resolve-event'){resolveEvent();return true}if(a==='birthday-express'){expressBirthday();return true}if(S.phase!=='arrival')return false;const index=Number(a.split('-').pop());if(a.startsWith('task-bus-')){if(index!==S.taskStage)return true;S.taskStage++;if(S.taskStage===3)finishTask();else{sparkle();render()}return true}if(a==='task-metro-close'){if(S.taskStage!==1)return true;finishTask();return true}if(a.startsWith('task-metro-')){if(S.taskStage)return true;if(index!==1){toast('今天去绿色站台哦');return true}S.taskStage=1;sparkle();render();return true}if(a.startsWith('task-rail-')){if(index!==S.taskStage)return true;S.taskStage++;if(S.taskStage===3)finishTask();else render();return true}if(a.startsWith('task-museum-')||a.startsWith('task-zoo-')){if(S.taskDone.has(index))return true;S.taskDone.add(index);sparkle();if(S.taskDone.size===3)finishTask();else render();return true}if(a.startsWith('task-airport-runway-')){if(index!==0){toast('这条跑道还没准备好，试试左边跑道');return true}S.taskStage=1;speak('start','左边跑道安全，可以起飞啦！');render();return true}if(a==='task-airport-takeoff'){if(S.taskStage!==1)return true;finishTask();return true}return false}
$('panel').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;if(speechLock)stopSpeech();if(handleStationAction(b.dataset.act)){e.stopImmediatePropagation();return}},true);
$('panel').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;S.soundAllowed=true;sparkle();if(a.startsWith('vehicle-'))chooseVehicle(a.slice(8));else if(a.startsWith('filter-')){S.filter=a.slice(7);render()}else if(a.startsWith('target-'))chooseMission(a.slice(7));else if(a.startsWith('route-'))chooseRoute(Number(a.slice(6)));else if(a==='cab-door'){S.doorClosed=true;speak('doors',S.vehicle==='car'?'安全带已系好，请注意安全！':'车门已关闭，请注意安全！');render()}else if(a==='cab-start'){if(!S.doorClosed)return;S.phase='travel';speak('start',S.vehicle==='car'?'导航开始啦，系好安全带，我们出发！':'导航开始啦，我们出发！');render();setTimeout(()=>centerOn(S.here),70)}else if(a==='cab-horn'){sparkle();toast(S.vehicle==='car'?'📣 嘀——奶思小司机按喇叭啦！':'📣 嘟——奶思列车长鸣笛啦！')}else if(a==='open-door'){S.phase=S.target==='birthday'?'birthday':'arrival';S.doorClosed=false;speak('arrive',S.target==='birthday'?'车门已打开，来点亮六根生日蜡烛吧！':'车门已打开，小乘客可以下车啦！');render()}else if(a.startsWith('go-'))tryNext(a.slice(3));else if(a==='resolve-event')resolveEvent();else if(a.startsWith('object-')){S.taskDone.add(Number(a.slice(7)));if(S.taskDone.size>=3)finishTask();else render()}else if(a==='more'){S.phase='choose';S.target=null;S.route=[];S.blocked=null;speak('turn','前方有岔路口，看地图，选一条你喜欢的路吧！');render()}else if(a.startsWith('candle-')){S.candles.add(Number(a.slice(7)));if(S.candles.size===6)speak('reward','蜡烛全点亮啦！打开生日礼物吧！');render()}else if(a==='gift')birthdayGift();else if(a==='dad')dadBlessing();else if(a==='restart')reset()});
$('mapToggle').addEventListener('click',()=>{if(S.phase!=='travel')return;if(speechLock)stopSpeech();S.mapExpanded=!S.mapExpanded;syncMapToggle();centerOn();persist()});$('mapPins').addEventListener('click',e=>{const b=e.target.closest('[data-node]');if(!b||b.disabled||S.phase!=='choose')return;e.preventDefault();if(speechLock)stopSpeech();sparkle();chooseMission(b.dataset.node)});
$('panel').addEventListener('click',e=>{const b=e.target.closest('[data-act^="album-"]');if(!b||b.disabled||S.phase!=='gift')return;const a=b.dataset.act;if(a==='album-prev')albumIndex=(albumIndex+ALBUM_PHOTOS.length-1)%ALBUM_PHOTOS.length;else if(a==='album-next')albumIndex=(albumIndex+1)%ALBUM_PHOTOS.length;else if(a==='album-random'){let next=albumIndex;while(next===albumIndex)next=Math.floor(random()*ALBUM_PHOTOS.length);albumIndex=next}else if(a.startsWith('album-photo-'))albumIndex=Number(a.slice(12));render()});
$('centerBtn').addEventListener('click',()=>centerOn());$('soundBtn').addEventListener('click',()=>{S.sound=!S.sound;if(!S.sound)stopSpeech();render();if(S.sound)speak('intro','奶思小司机，欢迎来到你的交通宇宙。今天想开小火车，还是小汽车呀？')});$('replayBtn').addEventListener('click',()=>{if(S.lastAudio)speak(S.lastAudio,S.lastVoice);else speak('intro','奶思小司机，欢迎来到你的交通宇宙。今天想开小火车，还是小汽车呀？')});$('avatarBtn').addEventListener('click',()=>{if(S.media.avatar){S.phase==='home'?toast('奶思，这是你的专属小司机证！'):toast('奶思列车长，欢迎回来！')}else{toast('请让家长添加奶思的照片')}});
$('panel').addEventListener('click',e=>{const b=e.target.closest('[data-act="cab-horn"]');if(b&&!b.disabled)playHorn()});

async function privatePhotos(){if(!CFG.encryptedPhotos||!globalThis.crypto?.subtle)return;const keyHex=(location.hash.match(/(?:^|[&#])k=([a-fA-F0-9]{64})/)||[])[1];if(!keyHex)return;try{const raw=Uint8Array.from(keyHex.match(/.{2}/g),x=>parseInt(x,16)),key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);let changed=false;for(const [id,v] of Object.entries(CFG.encryptedPhotos)){if(S.media[id]?.startsWith('blob:'))continue;const nonce=Uint8Array.from(atob(v.iv),c=>c.charCodeAt(0)),ct=Uint8Array.from(atob(v.data),c=>c.charCodeAt(0));const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:nonce},key,ct);S.media[id]=URL.createObjectURL(new Blob([plain],{type:'image/jpeg'}));changed=true}if(changed){render();toast('🎉 奶思的专属照片已经解锁啦！')}}catch{toast('照片解锁失败，请使用完整的家庭专属链接')}}
const parentOverlay=$('parentOverlay');$('parentBtn').addEventListener('click',()=>{parentOverlay.hidden=false;showGate()});$('closeParent').addEventListener('click',()=>parentOverlay.hidden=true);parentOverlay.addEventListener('click',e=>{if(e.target===parentOverlay)parentOverlay.hidden=true});
function showGate(){$('parentContent').innerHTML='<p>家长可以更换孩子照片和爸爸祝福。照片默认只存储在当前设备。</p><label for="gate">家长验证：8 + 5 = ?</label><input type="number" inputmode="numeric" id="gate" aria-label="家长验证答案"><div class="row"><button class="primary" id="gateOK">进入设置</button></div><p id="gateMsg" aria-live="polite"></p>';$('gateOK').onclick=()=>{if($('gate').value==='13')showSettings();else $('gateMsg').textContent='再算一算哦！'}}
const mediaSlots=[['avatar','奶思头像','image/*',6],['portrait','生日照片','image/*',6],['drawing','画画时的照片','image/*',6],['voice','爸爸的真实祝福录音','audio/*',15],['video','爸爸的生日祝福视频','video/*',45]];
function showSettings(){$('parentContent').innerHTML='<p>替换照片后会保存在本机浏览器中；重新打开仍然可以看到。爸爸和孩子使用不同设备，需要各自在设备上添加，或使用家庭专属链接。</p>'+mediaSlots.map(([id,label,accept,limit])=>`<label for="file-${id}">${label} ${S.media[id]?'✅':''}</label><input id="file-${id}" type="file" accept="${accept}" data-media="${id}"><small>建议不超过 ${limit} MB</small>`).join('')+'<p class="note">🔐 家庭专属链接中的照片是加密的。请不要把带密钥的链接公开发布；只发给家人。普通公开链接不显示照片。</p><div class="row"><button class="secondary" id="clearLocal">清除本机自行添加的素材</button></div><p id="settingResult" aria-live="polite"></p>';$('parentContent').querySelectorAll('input[data-media]').forEach(el=>{el.onchange=async()=>{const file=el.files?.[0];if(!file)return;const k=el.dataset.media,slot=mediaSlots.find(a=>a[0]===k);if(file.size>slot[3]*1024*1024){$('settingResult').textContent='素材太大啦，请选个小一点的文件';return}if(S.media[k]?.startsWith('blob:'))URL.revokeObjectURL(S.media[k]);S.media[k]=URL.createObjectURL(file);try{if(S.db){const tx=S.db.transaction('assets','readwrite');tx.objectStore('assets').put({id:k,blob:file});await new Promise((ok,bad)=>{tx.oncomplete=ok;tx.onerror=bad});toast('✅ 已保存在这台设备！')}else toast('✅ 本次设置成功；换设备需要重新添加')}catch{toast('设置成功，但可能无法长期保存')}render();showSettings()}});$('clearLocal').onclick=()=>{if(!confirm('确定清除本机自行添加的素材？'))return;try{S.db?.transaction('assets','readwrite').objectStore('assets').clear()}catch{}for(const k of mediaSlots.map(x=>x[0])){const v=S.media[k];if(v?.startsWith('blob:'))URL.revokeObjectURL(v);delete S.media[k]}Object.assign(S.media,CFG.localPhotos||{});privatePhotos();render();showSettings()}}
function initDB(){if(!('indexedDB'in window))return;let req;try{req=indexedDB.open('naisi-v3-private',1)}catch{return}req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('assets'))req.result.createObjectStore('assets',{keyPath:'id'})};req.onsuccess=()=>{S.db=req.result;let q=S.db.transaction('assets','readonly').objectStore('assets').getAll();q.onsuccess=()=>{for(const it of q.result)S.media[it.id]=URL.createObjectURL(it.blob);render()}}}
